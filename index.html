<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vault Group</title>
  <meta name="description" content="Vault Group, mobile and electronics store. Follow us on Instagram, Facebook and TikTok.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="backdrop" viewBox="0 0 800 800" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
    <polygon points="40,60 250,60 400,560 330,560" />
    <polygon points="760,60 560,60 420,520 500,520" />
  </svg>

  <main class="page">

      <img class="logo" src="assets/logo.png" width="384" height="196" alt="Vault Group">
      <p class="tagline">Mobile &amp; Electronics Store</p>

    <nav aria-label="Vault Group on social media">
      <ul class="links">
        <li style="--i:0">
          <a class="link" href="https://www.instagram.com/vaultgroup961" target="_blank" rel="noopener">

            <span class="text"><span class="name">Instagram</span><span class="handle">@vaultgroup961</span></span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
          </a>
        </li>
        <li style="--i:1">
          <a class="link" href="https://www.tiktok.com/@vault.group" target="_blank" rel="noopener">

          </a>
        </li>
        <li style="--i:2">
          <a class="link" href="https://www.facebook.com/share/1Cfr5af2DV/" target="_blank" rel="noopener">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 8.5V6.9c0-.7.2-1.1 1.2-1.1H17V3h-2.4C12 3 10.8 4.5 10.8 6.6v1.9H9v2.9h1.8V21H14v-9.6h2.3l.4-2.9H14z"/></svg>

            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
          </a>
        </li>
      </ul>
    </nav>

    <footer class="foot">&copy; <span id="year">2026</span> Vault Group</footer>

  <script src="script.js"></script>

</html>
